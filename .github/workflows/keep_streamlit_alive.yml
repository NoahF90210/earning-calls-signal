# Wakes the public Streamlit app periodically so free-tier sleep happens less often.
# Optional: set repository secret STREAMLIT_KEEP_ALIVE_URL to override the default URL.
name: Keep Streamlit warm

on:
  schedule:
    # Every 10 minutes (UTC). Adjust if Streamlit changes idle behavior.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Streamlit app
        env:
          STREAMLIT_KEEP_ALIVE_URL: ${{ secrets.STREAMLIT_KEEP_ALIVE_URL }}
        run: python3 scripts/keep_alive.py
