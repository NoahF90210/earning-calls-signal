[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-call-signal"
version = "0.1.0"
description = "NLP dashboard for testing whether earnings-call language predicts post-earnings stock moves."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24",
    "scikit-learn>=1.4",
    "streamlit>=1.39",
    "yfinance>=0.2.44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]
research = [
    "datasets>=2.18",
    "pyarrow>=15.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/dashboard.py" = ["E402", "I001"]
"scripts/*.py" = ["E402", "I001"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
